<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>

<form>
  <label for="username">Username:</label>
  <input type="text" name="username" id="username" required autocomplete="text">

  <label for="password">Password</label>
  <input type="password" name="password" id="password" required>

  <label for="email-address">Email Address:</label>
  <input type="email" name="email-address" id="email-address" placeholder="example@gmail.com" required
         autocomplete="email"> <br>

  <input type="checkbox" name="food-menu" id="pizza">
  <label for="pizza">pizza</label> <br>
  <input type="checkbox" name="food-menu" id="hamburger">
  <label for="hamburger">hamburger</label> <br>
  <input type="checkbox" name="food-menu" id="salad">
  <label for="salad">salad</label> <br> <br>

  <input type="radio" name="dessert-menu" id="cake">
  <label for="cake">cake</label> <br>
  <input type="radio" name="dessert-menu" id="tiramisu">
  <label for="tiramisu">tiramisu</label> <br>
  <input type="radio" name="dessert-menu" id="sweets">
  <label for="sweets">sweets</label> <br><br>




  <button type="submit">submit</button>
</form>

</body>
</html>
