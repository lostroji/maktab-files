<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="div-alignment">

  <div class="form-items">
    <p class="p-alignment">It is recommended to use this: accept or decline.</p>

    <form>
      <input type="text" name="first-name" id="first-name" placeholder="First name" autocomplete="text" required>
      <label for="first-name"></label> <br> <br>

      <input type="text" name="last-name" id="last-name" placeholder="Last name" autocomplete="text" required>
      <label for="last-name"></label> <br> <br>

      <input type="email" name="email-address" id="email-address" placeholder="Email address" autocomplete="email"
             required>
      <label for="email-address"></label> <br> <br>

      <input type="password" name="password" id="password" placeholder="Password" autocomplete="password" required>
      <label for="password"></label> <br> <br>

      <!--  <fieldset>Optional: fill out description</fieldset>-->

      <button type="submit">Login</button>
    </form>

    <p>By submitting you are accepting the terms of service</p>
  </div>
</div>

</body>
</html>
